<html lang="pt-br">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

    <style>
        :root { 
            --gold: #c5a059; 
            --bg: #f4f7f6; 
            --card: #ffffff; 
            --text: #333; 
            --border: #e0e0e0; 
            --blue: #0056b3; 
        }

        * {
            box-sizing: border-box;
        }

        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding-bottom: 40px; 
            overflow-y: auto !important;
            transition: background 0.3s, color 0.3s;
        }

        /* CABEÇALHO COMPACTO MOBILE-FIRST COM LOGO */
        .header-mobile {
            background-color: #0b0c0e;
            border-bottom: 2px solid var(--gold);
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
        }

        .header-mobile .brand-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .header-mobile .brand-logo img {
            height: 62px;
            max-width: 82vw;
            width: auto;
            object-fit: contain;
        }

        .btn-theme-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid #2b2f36;
            color: var(--gold);
            width: 38px;
            height: 38px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
        }

        .btn-theme-toggle:active {
            background: rgba(197, 160, 89, 0.2);
        }

        /* CAMPO DE BUSCA E FILTRO */
        .search-container {
            max-width: 900px;
            margin: 16px auto 0;
            padding: 0 14px;
        }

        .search-controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .search-box {
            width: 100%;
            position: relative;
            display: flex;
            align-items: center;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 15px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            transition: 0.2s;
        }

        .search-box:focus-within {
            border-color: var(--gold);
            box-shadow: 0 0 8px rgba(197, 160, 89, 0.25);
        }

        .search-box i {
            color: #999;
            margin-right: 12px;
            font-size: 1.05rem;
        }

        .search-box input {
            border: none;
            outline: none;
            background: transparent;
            width: 100%;
            font-size: 1rem;
            color: var(--text);
            font-family: inherit;
        }

        .filter-select {
            width: 100%;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 0.95rem;
            color: var(--text);
            font-family: inherit;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
        }

        .filter-select:focus {
            border-color: var(--gold);
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            font-size: 0.8rem;
            color: #666;
            padding: 0 2px;
        }

        /* CONTAINER E TABELA */
        .container { 
            max-width: 900px; 
            margin: 0 auto; 
            padding: 12px 14px 20px; 
        }

        .table-wrapper {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        thead {
            background-color: #0b0c0e;
            color: #f1c40f;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        th {
            padding: 12px 14px;
            font-weight: 700;
            border-bottom: 2px solid var(--gold);
        }

        td {
            padding: 13px 14px;
            border-bottom: 1px solid var(--border);
            font-size: 0.92rem;
            vertical-align: middle;
        }

        /* LINHA DE CABEÇALHO DE DIVISÃO / DELEGACIA */
        tr.group-header {
            background-color: #1a2332 !important;
            color: #ffffff;
        }

        tr.group-header td {
            font-weight: 800;
            font-size: 0.86rem;
            letter-spacing: 0.5px;
            padding: 9px 14px;
            color: #f1c40f;
            border-top: 2px solid var(--gold);
            border-bottom: 1px solid #2a3a52;
        }

        .badge-unidade {
            display: inline-block;
            font-size: 0.68rem;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 4px;
            background: rgba(0, 86, 179, 0.1);
            color: var(--blue);
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .setor-nome {
            font-weight: 700;
            font-size: 0.96rem;
            color: var(--text);
            display: block;
            line-height: 1.3;
        }

        /* ITENS DE TELEFONE E BOTÃO DE LIGAR OTIMIZADOS PARA TOQUE */
        .tel-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 7px 0;
            border-bottom: 1px dashed rgba(0, 0, 0, 0.08);
        }

        .tel-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .tel-row:first-child {
            padding-top: 0;
        }

        body.dark-mode .tel-row {
            border-bottom-color: rgba(255, 255, 255, 0.08);
        }

        .tel-numero {
            font-variant-numeric: tabular-nums;
            font-weight: 700;
            font-size: 0.98rem;
            letter-spacing: 0.2px;
            white-space: nowrap;
        }

        .tel-inativo {
            color: #888;
            text-decoration: line-through;
        }

        .btn-ligar {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: linear-gradient(135deg, #28a745 0%, #1e7e34 100%);
            color: #ffffff !important;
            text-decoration: none !important;
            font-weight: 700;
            font-size: 0.85rem;
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid #218838;
            box-shadow: 0 2px 5px rgba(40, 167, 69, 0.25);
            transition: transform 0.12s ease, filter 0.15s ease;
            white-space: nowrap;
            min-height: 36px;
        }

        .btn-ligar:active {
            transform: scale(0.96);
            filter: brightness(1.1);
        }

        .badge-defeito {
            display: inline-block;
            background: #dc3545;
            color: #fff;
            font-size: 0.68rem;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 4px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .badge-desativado {
            display: inline-block;
            background: #6c757d;
            color: #fff;
            font-size: 0.68rem;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 4px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #777;
            display: none;
        }

        /* RESPONSIVIDADE PARA TELAS MUITO ESTREITAS */
        @media (max-width: 520px) {
            th, td {
                padding: 11px 10px;
            }
            .tel-row {
                flex-wrap: wrap;
                gap: 6px;
            }
            .tel-numero {
                font-size: 0.94rem;
            }
            .btn-ligar {
                padding: 7px 12px;
                font-size: 0.82rem;
            }
        }

        /* DARK MODE */
        body.dark-mode { 
            background: #121212; 
            color: #eee; 
            --card: #1e1e1e;
            --border: #333;
            --text: #eee;
            --blue: #58a6ff;

        body.dark-mode .filter-select,

            background: #1e1e1e; 
            border-color: #333; 
        }

        body.dark-mode .status-bar {
            color: #aaa;
        }

        body.dark-mode .badge-unidade {
            background: rgba(88, 166, 255, 0.15);
            color: #58a6ff;
        }
    </style>
</head>

    // NORMALIZA TEXTO (REMOVE ACENTOS PARA BUSCA FLEXÍVEL)
    function normalizar(str) {
        return (str || "")
            .toLowerCase()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "");
    }

    // POPULA O SELECT DE DIVISÕES / DELEGACIAS
    function popularFiltroUnidades() {
        const select = document.getElementById("unidadeFilter");
        const unidadesUnicas = [...new Set(contatosDEIC.map(item => item.unidade))];
        unidadesUnicas.forEach(unidade => {
            const option = document.createElement("option");
            option.value = unidade;
            option.textContent = unidade;
            select.appendChild(option);
        });
    }

    // FORMATA O NÚMERO PARA DISCAGEM NO CELULAR (EX: 2224-0805 -> tel:01122240805)
    function gerarLinkDiscagem(telefone) {
        const apenasDigitos = telefone.replace(/\D/g, "");
        const numeroCompleto = apenasDigitos.length === 8 ? `011${apenasDigitos}` : apenasDigitos;
        return `tel:${numeroCompleto}`;
    }

    // RENDERIZA A TABELA DE CONTATOS
    function renderizarTabela(lista) {
        const tbody = document.getElementById("corpoTabela");
        const emptyState = document.getElementById("emptyState");
        const contador = document.getElementById("contadorResultados");
        tbody.innerHTML = "";

        if (lista.length === 0) {
            emptyState.style.display = "block";
            contador.textContent = "0 registros";
            return;
        }

        emptyState.style.display = "none";
        contador.textContent = `${lista.length} de ${contatosDEIC.length} setores`;

        let unidadeAtual = "";

        lista.forEach(item => {
            if (item.unidade !== unidadeAtual) {
                unidadeAtual = item.unidade;
                const trGrupo = document.createElement("tr");
                trGrupo.className = "group-header";
                trGrupo.innerHTML = `<td colspan="2"><i class="fa fa-building" style="margin-right: 7px;"></i>${unidadeAtual}</td>`;
                tbody.appendChild(trGrupo);
            }

            const tr = document.createElement("tr");

            const setorDesativado = item.pessoa === "Desativada";
            const colSetor = `
                <span class="badge-unidade">${item.unidade}</span>
                <span class="setor-nome">
                    ${item.setor}
                    ${setorDesativado ? '<span class="badge-desativado" style="margin-left:5px;">Desativada</span>' : ''}
                </span>
            `;

            let colTelefones = `<span style="color:#999; font-size:0.85rem;">Sem telefone</span>`;

            if (item.telefones.length > 0) {
                colTelefones = item.telefones.map((tel, idx) => {
                    const infoRamal = (item.ramais && item.ramais[idx]) ? item.ramais[idx].toLowerCase() : "";
                    const temDefeito = infoRamal.includes("defeito");
                    const estaDesativado = infoRamal.includes("desativado") || setorDesativado;

                    if (temDefeito) {
                        return `
                            <div class="tel-row">
                                <span class="tel-numero tel-inativo">${tel}</span>
                                <span class="badge-defeito">Defeito</span>
                            </div>
                        `;
                    }

                    if (estaDesativado) {
                        return `
                            <div class="tel-row">
                                <span class="tel-numero tel-inativo">${tel}</span>
                                <span class="badge-desativado">Desativado</span>
                            </div>
                        `;
                    }

                    const linkTel = gerarLinkDiscagem(tel);
                    return `
                        <div class="tel-row">
                            <span class="tel-numero">${tel}</span>
                            <a href="${linkTel}" class="btn-ligar" title="Ligar para ${item.setor}">
                                <i class="fa fa-phone-alt"></i> Ligar
                            </a>
                        </div>
                    `;
                }).join("");
            }

            tr.innerHTML = `
                <td>${colSetor}</td>
                <td>${colTelefones}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    // FILTRA EM TEMPO REAL
    function filtrarContatos() {
        const termoRaw = document.getElementById("searchInput").value.trim();
        const termo = normalizar(termoRaw);
        const termoNumerico = termoRaw.replace(/[\s\-\.]/g, "");
        const unidadeSelecionada = document.getElementById("unidadeFilter").value;

        const filtrados = contatosDEIC.filter(item => {
            if (unidadeSelecionada && item.unidade !== unidadeSelecionada) {
                return false;
            }

            if (!termo) return true;

            const textoUnidade = normalizar(item.unidade);
            const textoSetor = normalizar(item.setor);
            const textoTelefones = item.telefones.join(" ").toLowerCase();
            const textoTelefonesLimpo = item.telefones.map(t => t.replace(/[\s\-\.]/g, "")).join(" ");

            return (
                textoUnidade.includes(termo) ||
                textoSetor.includes(termo) ||
                textoTelefones.includes(termo) ||
                (termoNumerico.length > 0 && textoTelefonesLimpo.includes(termoNumerico))
            );
        });

        renderizarTabela(filtrados);
    }

    // CONTROLE DO TEMA (CLARO / ESCURO)
    function toggleTheme(){
        const b = document.body;
        const i = document.getElementById("theme-icon");
        b.classList.toggle("dark-mode");
        const isDark = b.classList.contains("dark-mode");
        localStorage.setItem("portalTheme", isDark ? "dark" : "light");
        if(i) i.className = isDark ? "fa fa-sun" : "fa fa-moon";
    }

    (function(){
        const s = localStorage.getItem("portalTheme");
        if(s === "dark") {
            document.body.classList.add("dark-mode");
            const i = document.getElementById("theme-icon");
            if(i) i.className = "fa fa-sun";
        }
        popularFiltroUnidades();
        renderizarTabela(contatosDEIC);
    })();
